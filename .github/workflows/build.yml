name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout dependencies
        shell: pwsh
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build shell extensions
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'HashCalculator\ShellExt'
          msbuild ShellExtensions/ShellExtensions.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:OutDir="$outputDir\"
          msbuild ShellExtensions/ShellExtensions.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$outputDir\"

      - name: Build application
        run: dotnet build HashCalculator/HashCalculator.csproj --configuration Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HashCalculator-Release
          path: Bin/Release/net10.0-windows7.0/
          if-no-files-found: error
