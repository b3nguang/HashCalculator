name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build HashCalculator/HashCalculator.csproj --configuration Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HashCalculator-Release
          path: Bin/Release/net10.0-windows7.0/
          if-no-files-found: error
